<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fără internet | The Entertainers</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="/assets/mic-gold.png">
<style>
:root{--gold:#d4af37;--gold2:#f3d77a;--text:#f2efe6;--muted:#a39f94}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(ellipse at 50% 30%,rgba(212,175,55,.14),transparent 60%),#0b0b0c;color:var(--text);font:16px/1.6 Montserrat,system-ui,sans-serif;text-align:center}
.box{max-width:420px}
img{width:220px;max-width:70%;height:auto;margin-bottom:22px}
h1{font:700 1.6rem "Playfair Display",Georgia,serif;margin:0 0 10px;color:var(--gold2)}
p{color:var(--muted);margin:0 0 22px}
a,button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;font:700 .95rem Montserrat,system-ui,sans-serif;cursor:pointer;text-decoration:none;margin:4px}
button{border:0;background:linear-gradient(135deg,#f3d77a,#d4af37 55%,#a8841f);color:#1a1405}
a{border:1px solid rgba(243,215,122,.5);color:var(--text)}
</style>
</head>
<body>
<div class="box">
  <img src="/assets/logo-gold.png" alt="The Entertainers">
  <h1>Nu ai conexiune la internet</h1>
  <p>Verifică semnalul sau Wi-Fi-ul și încearcă din nou. Între timp, ne poți suna direct.</p>
