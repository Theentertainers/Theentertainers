<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin – The Entertainers</title>
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="assets/mic-gold.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
body{min-height:100vh}
.top{position:sticky;top:0;z-index:40;background:rgba(11,11,12,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding:10px 0}
.top img{height:36px}
.top .tt{font-weight:600;color:var(--gold2);letter-spacing:2px;text-transform:uppercase;font-size:.78rem;border:1px solid rgba(243,215,122,.35);padding:4px 10px;border-radius:999px}
.top .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.top a.lnk{color:var(--muted);font-size:.85rem}
.top a.lnk:hover{color:var(--gold2)}
main{padding:28px 0 80px}
.hidden{display:none!important}

/* login */
.login{max-width:400px;margin:12vh auto 0;padding:34px 30px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);text-align:center;box-shadow:0 30px 60px -30px #000}
.login img{height:64px;margin:0 auto 18px}
.login h1{font-size:1.6rem;margin-bottom:20px}
.f{display:grid;gap:6px;text-align:left;margin-bottom:14px}
.f label{font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.4px}
.f input,.f select,.f textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0e0e11;outline:none;transition:border-color .2s}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--gold)}
.f textarea{min-height:84px;resize:vertical}
.err{color:#ff8f8f;font-size:.88rem;min-height:1.3em;margin:4px 0 10px}
.ok{color:#7fcf9a}

/* sumar */
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 0}
.sum div{padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.sum b{display:block;font-family:"Playfair Display",serif;font-size:1.5rem}
.sum span{font-size:.8rem;color:var(--muted)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.bar h1{font-size:1.7rem}
.day{cursor:pointer}

/* listă */
.list{display:grid;gap:12px;margin-top:26px}
.list h2{font-size:1.3rem;margin-bottom:4px}
.ev{display:grid;grid-template-columns:110px 1fr auto;gap:16px;align-items:start;padding:16px 18px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.ev.prov{border-style:dashed;border-color:rgba(243,215,122,.5)}
.ev .dt{font-family:"Playfair Display",serif;font-size:1.05rem;color:var(--gold2);line-height:1.3}
.ev .dt small{display:block;font-family:Montserrat,sans-serif;font-size:.75rem;color:var(--muted)}
.ev h3{font-family:Montserrat,sans-serif;font-size:1rem;font-weight:700;margin-bottom:4px}
.ev .meta{color:#cfcabe;font-size:.88rem;display:flex;flex-wrap:wrap;gap:4px 16px}
.ev .meta a{color:var(--gold2)}
.ev .notes{color:var(--muted);font-size:.86rem;margin-top:6px;white-space:pre-wrap}
.tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:2px}
.tag.c{background:rgba(127,207,154,.15);color:#7fcf9a}
.tag.p{background:rgba(243,215,122,.12);color:var(--gold2);border:1px dashed rgba(243,215,122,.6)}
.acts{display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#0e0e11;color:var(--gold2);cursor:pointer;display:grid;place-items:center}
.ib:hover{border-color:var(--gold)}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.del{color:#ff8f8f}
.empty-l{color:var(--muted);text-align:center;padding:22px;border:1px dashed var(--line);border-radius:14px}

/* fereastră formular */
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px}
.box{width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px 24px}
.box h2{font-size:1.4rem;margin-bottom:6px}
.box .sub{color:var(--muted);font-size:.88rem;margin-bottom:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.seg{display:flex;gap:8px}
.seg label{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:12px;border:1px solid var(--line);cursor:pointer;font-size:.9rem;font-weight:600;color:#cfcabe;background:#0e0e11}
.seg input{accent-color:var(--gold)}
.seg label:has(input:checked){border-color:var(--gold);color:var(--gold2);background:rgba(212,175,55,.08)}
.warn{padding:10px 14px;border-radius:12px;background:rgba(255,143,143,.08);border:1px solid rgba(255,143,143,.35);color:#ffc2c2;font-size:.86rem;margin-bottom:14px}
.dayev{display:grid;gap:8px;margin-bottom:16px}
.dayev button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0e0e11;cursor:pointer;text-align:left}
.dayev button:hover{border-color:var(--gold)}
.foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.toast{position:fixed;left:50%;bottom:24px;translate:-50% 0;z-index:90;padding:12px 20px;border-radius:999px;background:#1d1d22;border:1px solid var(--gold);color:var(--gold2);font-weight:600;font-size:.9rem;box-shadow:0 10px 30px -10px #000;transition:opacity .3s;opacity:0;pointer-events:none}
.toast.show{opacity:1}

/* tab-uri + cereri */
.tabs{display:flex;gap:6px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.tab{padding:12px 18px;border:0;background:none;color:var(--muted);font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--gold2);border-bottom-color:var(--gold)}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#e5484d;color:#fff;font-size:.75rem;margin-left:6px}
.flt{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#0e0e11}
.rq{padding:18px 20px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.rq.new{border-color:rgba(212,175,55,.6);box-shadow:0 0 0 1px rgba(212,175,55,.25)}
.rq-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.rq-h h3{font-family:Montserrat,sans-serif;font-size:1.05rem}
.rq-h h3 span{color:var(--gold2)}
.rq .when{font-size:.78rem;color:var(--muted)}
.rq .meta{color:#cfcabe;font-size:.9rem;display:flex;flex-wrap:wrap;gap:4px 16px}
.rq .meta a{color:var(--gold2)}
.rq .msg{color:var(--muted);font-size:.88rem;margin-top:8px;white-space:pre-wrap}
.rq .busy{color:#ffb38f;font-size:.85rem;font-weight:600;margin-top:8px}
.rq-a{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.rq-a select{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#0e0e11;font-size:.88rem}
.tag.n{background:rgba(229,72,77,.15);color:#ff9b9b}
.tag.k{background:rgba(120,160,255,.14);color:#a9c1ff}
.tag.r{background:rgba(255,255,255,.06);color:var(--muted)}

@media (max-width:760px){
  .sum{grid-template-columns:1fr 1fr}
  .ev{grid-template-columns:1fr;gap:8px}
  .acts{justify-content:flex-end}
  .g2{grid-template-columns:1fr}
  .top .tt{display:none}
}
</style>
</head>
<body>

<div class="top">
  <div class="wrap">
    <a href="index.html"><img src="assets/logo-gold.png" alt="The Entertainers"></a>
    <span class="tt">Admin</span>
    <div class="sp">
      <a class="lnk" href="calendar.html" target="_blank">Vezi calendarul public ↗</a>
      <button class="btn btn-ghost btn-sm hidden" id="logout">Ieșire</button>
    </div>
  </div>
</div>

<main class="wrap">

  <!-- LOGIN -->
  <form class="login hidden" id="loginBox" autocomplete="on">
    <img src="assets/mic-gold.png" alt="">
    <h1>Intră în <span class="gold">admin</span></h1>
    <div class="f"><label for="em">Email</label><input id="em" type="email" autocomplete="username" required value="bacanucozmin@gmail.com"></div>
    <div class="f"><label for="pw">Parolă</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <div class="err" id="lerr"></div>
    <button class="btn btn-gold" style="width:100%" id="lbtn">Intră</button>
  </form>

  <!-- APLICAȚIA -->
  <div class="hidden" id="app">
    <div class="tabs">
      <button class="tab on" data-t="tabCal">Calendar</button>
      <button class="tab" data-t="tabReq">Cereri de rezervare <span class="badge hidden" id="badge"></span></button>
    </div>

    <div id="tabReq" class="hidden">
      <div class="bar">
        <h1>Cereri de <span class="gold">rezervare</span></h1>
        <select id="reqFilter" class="flt">
          <option value="active">Noi + contactate</option>
          <option value="all">Toate</option>
          <option value="nouă">Doar noi</option>
          <option value="confirmat">Confirmate</option>
          <option value="respins">Respinse</option>
        </select>
      </div>
      <div class="list" id="reqList" style="margin-top:0"></div>
    </div>

    <div id="tabCal">
    <div class="bar">
      <h1>Calendar <span class="gold">evenimente</span></h1>
      <button class="btn btn-gold btn-sm" id="addBtn">+ Adaugă eveniment</button>
    </div>
    <div class="cal">
      <div class="cal-top">
        <button class="cal-nav" id="prev" aria-label="Luna anterioară">‹</button>
        <h2 id="title">…</h2>
        <button class="cal-nav" id="next" aria-label="Luna următoare">›</button>
      </div>
      <div class="cal-grid" id="grid"></div>
      <div class="cal-msg" id="msg"></div>
      <div class="legend">
        <span><i></i>Liber</span>
        <span><i class="l-full"></i>Ocupat</span>
        <span><i class="l-prov"></i>Provizoriu</span>
      </div>
    </div>
    <div class="sum" id="sum"></div>
    <div class="list" id="list"></div>
    </div>
  </div>
</main>

<!-- FORMULAR EVENIMENT -->
<div class="modal hidden" id="modal">
  <form class="box" id="form">
    <h2 id="fTitle">Eveniment nou</h2>
    <p class="sub">Vizitatorii văd doar data, tipul și dacă e confirmat. Restul îl vezi doar tu.</p>
    <div class="dayev hidden" id="dayEv"></div>
    <div class="warn hidden" id="capWarn"></div>
    <div class="g2">
      <div class="f"><label for="fDate">Data *</label><input id="fDate" type="date" required><small id="fDateTxt" style="color:var(--gold2);font-weight:600;font-size:.85rem"></small></div>
      <div class="f"><label for="fType">Tip eveniment *</label><select id="fType" required></select></div>
    </div>
    <div class="f"><label>Statut</label>
      <div class="seg">
        <label><input type="radio" name="st" value="confirmat" checked> Confirmat</label>
        <label><input type="radio" name="st" value="provizoriu"> Provizoriu</label>
      </div>
    </div>
    <div class="g2">
      <div class="f"><label for="fName">Nume client</label><input id="fName" maxlength="120"></div>
      <div class="f"><label for="fPhone">Telefon client</label><input id="fPhone" type="tel" maxlength="40"></div>
      <div class="f"><label for="fCity">Localitate</label><input id="fCity" maxlength="80"></div>
      <div class="f"><label for="fVenue">Locație (restaurant, sală)</label><input id="fVenue" maxlength="120"></div>
      <div class="f"><label for="fPrice">Preț (lei)</label><input id="fPrice" type="number" min="0" step="1" inputmode="numeric"></div>
      <div class="f"><label for="fDep">Avans primit (lei)</label><input id="fDep" type="number" min="0" step="1" inputmode="numeric"></div>
    </div>
    <div class="f"><label for="fNotes">Observații</label><textarea id="fNotes" maxlength="2000"></textarea></div>
    <div class="err" id="ferr"></div>
    <div class="foot">
      <button type="button" class="btn btn-ghost btn-sm" id="fDel" style="margin-right:auto;color:#ff8f8f;border-color:rgba(255,143,143,.5)">Șterge</button>
      <button type="button" class="btn btn-ghost btn-sm" id="fCancel">Renunță</button>
      <button class="btn btn-gold btn-sm" id="fSave">Salvează</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/site.js"></script>
<script>
const sb = supabase.createClient(TE.SUPABASE_URL, TE.SUPABASE_KEY);
const $ = id => document.getElementById(id);
const lei = n => (Number(n) || 0).toLocaleString('ro-RO') + ' lei';
const now = new Date();
let y = now.getFullYear(), m = now.getMonth(), events = [], editing = null;

TE.TYPES.forEach(t => $('fType').insertAdjacentHTML('beforeend', `<option>${t}</option>`));

function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2400); }

// ---------- login ----------
async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  show(!!session);
}
function show(logged){
  $('loginBox').classList.toggle('hidden', logged);
  $('app').classList.toggle('hidden', !logged);
  $('logout').classList.toggle('hidden', !logged);
  if (logged) { draw(); loadReq(); } else $('pw').focus();
}

// ---------- tab-uri ----------
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  ['tabCal','tabReq'].forEach(id => $(id).classList.toggle('hidden', id !== b.dataset.t));
  if (b.dataset.t === 'tabReq') loadReq();
});

// ---------- cereri de rezervare ----------
let reqs = [], fromReq = null;
const ST = { 'nouă':'n', 'contactat':'k', 'confirmat':'c', 'respins':'r' };
async function loadReq(){
  const { data, error } = await sb.from('requests').select('*').order('created_at', { ascending: false }).limit(300);
  if (error) { $('reqList').innerHTML = `<div class="empty-l">Cererile nu s-au putut încărca: ${TE.esc(error.message)}</div>`; return; }
  reqs = data;
  const n = reqs.filter(r => r.status === 'nouă').length;
  $('badge').textContent = n; $('badge').classList.toggle('hidden', !n);
  // ce date din cereri sunt deja ocupate
  const dates = [...new Set(reqs.map(r => r.event_date))];
  const taken = new Set();
  if (dates.length) { const { data: ev } = await sb.from('events').select('date').in('date', dates); (ev || []).forEach(e => taken.add(e.date)); }
  renderReq(taken);
}
$('reqFilter').onchange = () => loadReq();
function renderReq(taken){
  const f = $('reqFilter').value;
  const list = reqs.filter(r => f === 'all' ? true : f === 'active' ? (r.status === 'nouă' || r.status === 'contactat') : r.status === f);
  if (!list.length) { $('reqList').innerHTML = '<div class="empty-l">Nicio cerere aici.</div>'; return; }
  $('reqList').innerHTML = list.map(r => {
    const when = new Date(r.created_at).toLocaleString('ro-RO', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
    const meta = [
      `📞 <a href="tel:${TE.esc(r.phone)}">${TE.esc(r.phone)}</a>`,
      r.email && `✉️ <a href="mailto:${TE.esc(r.email)}">${TE.esc(r.email)}</a>`,
      (r.city || r.venue) && `📍 ${TE.esc([r.venue, r.city].filter(Boolean).join(', '))}`,
      r.guests && `👥 ~${r.guests} invitați`,
      r.services?.length && `🎛 ${TE.esc(r.services.join(', '))}`
    ].filter(Boolean).map(x => `<span>${x}</span>`).join('');
    const wa = 'https://wa.me/' + r.phone.replace(/^\+/, '').replace(/^0/, '40');
    const isBusy = taken.has(r.event_date) && !r.event_id;
    return `<div class="rq${r.status === 'nouă' ? ' new' : ''}">
      <div class="rq-h"><h3>${TE.esc(r.type)} · <span>${TE.nice(r.event_date)}</span> · ${TE.esc(r.name)}<span class="tag ${ST[r.status]}">${r.status}</span></h3><span class="when">primită ${when}</span></div>
      <div class="meta">${meta}</div>
      ${r.message ? `<div class="msg">${TE.esc(r.message)}</div>` : ''}
      ${isBusy ? '<div class="busy">⚠ Data e deja ocupată în calendar.</div>' : ''}
      <div class="rq-a">
        <select data-s="${r.id}">${Object.keys(ST).map(s => `<option${s === r.status ? ' selected' : ''}>${s}</option>`).join('')}</select>
        <a class="btn btn-ghost btn-sm" href="tel:${TE.esc(r.phone)}">Sună</a>
        <a class="btn btn-ghost btn-sm" href="${wa}" target="_blank" rel="noopener">WhatsApp</a>
        ${r.event_id ? '<span style="color:#7fcf9a;font-size:.85rem;font-weight:600">✓ e în calendar</span>' : `<button class="btn btn-gold btn-sm" data-c="${r.id}"${isBusy ? ' disabled' : ''}>Trece în calendar</button>`}
        <button class="ib del" data-x="${r.id}" title="Șterge cererea" style="margin-left:auto">${icoDel}</button>
      </div></div>`;
  }).join('');
  $('reqList').querySelectorAll('[data-s]').forEach(s => s.onchange = async () => {
    const { error } = await sb.from('requests').update({ status: s.value }).eq('id', s.dataset.s);
    if (error) alert('Nu s-a salvat: ' + error.message); else { toast('Statut schimbat ✓'); loadReq(); }
  });
  $('reqList').querySelectorAll('[data-c]').forEach(b => b.onclick = () => toCalendar(reqs.find(r => r.id === b.dataset.c)));
  $('reqList').querySelectorAll('[data-x]').forEach(b => b.onclick = async () => {
    const r = reqs.find(x => x.id === b.dataset.x);
    if (!confirm(`Ștergi cererea lui ${r.name} (${TE.nice(r.event_date)})?`)) return;
    const { error } = await sb.from('requests').delete().eq('id', r.id);
    if (error) alert('Nu s-a șters: ' + error.message); else { toast('Cerere ștearsă ✓'); loadReq(); }
  });
}
// deschide formularul de eveniment completat cu datele din cerere
function toCalendar(r){
  const d = new Date(r.event_date + 'T12:00'); y = d.getFullYear(); m = d.getMonth();
  openForm(null, r.event_date);
  fromReq = r.id;
  $('fType').value = TE.TYPES.includes(r.type) ? r.type : 'Altul';
  document.querySelector('input[name=st][value=provizoriu]').checked = true;
  $('fName').value = r.name; $('fPhone').value = r.phone;
  $('fCity').value = r.city || ''; $('fVenue').value = r.venue || '';
  $('fNotes').value = [r.guests && `~${r.guests} invitați`, r.services?.length && 'Servicii: ' + r.services.join(', '), r.email && 'Email: ' + r.email, r.message].filter(Boolean).join('\n');
}
$('loginBox').addEventListener('submit', async e => {
  e.preventDefault();
  $('lerr').textContent = ''; $('lbtn').disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
  $('lbtn').disabled = false;
  if (error) { $('lerr').textContent = /invalid/i.test(error.message) ? 'Email sau parolă greșită.' : 'Nu m-am putut conecta: ' + error.message; return; }
  $('pw').value = ''; show(true);
});
$('logout').onclick = async () => { await sb.auth.signOut(); show(false); };

// ---------- calendar ----------
async function draw(){
  $('title').textContent = TE.MONTHS[m] + ' ' + y;
  $('msg').innerHTML = '<span class="spin"></span>Se încarcă…';
  const from = TE.iso(new Date(y, m, 1)), to = TE.iso(new Date(y, m + 1, 0));
  const { data, error } = await sb.from('events').select('*').gte('date', from).lte('date', to).order('date').order('created_at');
  if (error) {
    TE.renderMonth($('grid'), y, m, {}, { blank: true });
    $('msg').textContent = 'Eroare la încărcare: ' + error.message;
    if (/JWT|auth/i.test(error.message)) show(false);
    return;
  }
  $('msg').textContent = '';
  events = data;
  const by = {}; data.forEach(e => (by[e.date] ||= []).push(e));
  TE.renderMonth($('grid'), y, m, by, { admin: true, onDay: openDay });
  renderSummary(); renderList();
}
$('prev').onclick = () => { if (--m < 0) { m = 11; y--; } draw(); };
$('next').onclick = () => { if (++m > 11) { m = 0; y++; } draw(); };

function renderSummary(){
  const tot = events.reduce((s, e) => s + (+e.price || 0), 0);
  const dep = events.reduce((s, e) => s + (+e.deposit || 0), 0);
  $('sum').innerHTML = `
    <div><b class="gold">${events.length}</b><span>evenimente în ${TE.MONTHS[m]}</span></div>
    <div><b class="gold">${events.filter(e => e.status === 'provizoriu').length}</b><span>provizorii</span></div>
    <div><b class="gold">${lei(tot)}</b><span>total contracte</span></div>
    <div><b class="gold">${lei(tot - dep)}</b><span>rest de încasat (avans ${lei(dep)})</span></div>`;
}

const icoEdit = '<svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>';
const icoDel = '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';
function renderList(){
  if (!events.length) { $('list').innerHTML = `<h2>Evenimente în ${TE.MONTHS[m]}</h2><div class="empty-l">Niciun eveniment în luna asta. Apasă pe o zi din calendar ca să adaugi unul.</div>`; return; }
  $('list').innerHTML = `<h2>Evenimente în ${TE.MONTHS[m]}</h2>` + events.map(e => {
    const d = new Date(e.date + 'T12:00');
    const wd = d.toLocaleDateString('ro-RO', { weekday: 'long' });
    const meta = [
      e.client_name && `👤 ${TE.esc(e.client_name)}`,
      e.client_phone && `📞 <a href="tel:${TE.esc(e.client_phone.replace(/\s/g,''))}">${TE.esc(e.client_phone)}</a>`,
      (e.city || e.venue) && `📍 ${TE.esc([e.venue, e.city].filter(Boolean).join(', '))}`,
      e.price != null && `💰 ${lei(e.price)}${e.deposit ? ` · avans ${lei(e.deposit)} · rest ${lei(e.price - e.deposit)}` : ''}`
    ].filter(Boolean).map(x => `<span>${x}</span>`).join('');
    return `<div class="ev${e.status === 'provizoriu' ? ' prov' : ''}">
      <div class="dt">${d.getDate()} ${TE.MONTHS[d.getMonth()]}<small>${wd}</small></div>
      <div><h3>${TE.esc(e.type)}<span class="tag ${e.status === 'provizoriu' ? 'p' : 'c'}">${e.status}</span></h3>
        <div class="meta">${meta || '<span style="color:var(--muted)">Fără detalii</span>'}</div>
        ${e.notes ? `<div class="notes">${TE.esc(e.notes)}</div>` : ''}</div>
      <div class="acts"><button class="ib" data-e="${e.id}" title="Modifică">${icoEdit}</button><button class="ib del" data-x="${e.id}" title="Șterge">${icoDel}</button></div>
    </div>`;
  }).join('');
  $('list').querySelectorAll('[data-e]').forEach(b => b.onclick = () => openForm(events.find(e => e.id === b.dataset.e)));
  $('list').querySelectorAll('[data-x]').forEach(b => b.onclick = () => del(events.find(e => e.id === b.dataset.x)));
}

// ---------- formular ----------
// un singur eveniment pe zi: pe o zi ocupată se deschide direct evenimentul existent
function openDay(iso, dayEvents){
  if (dayEvents.length) openForm(dayEvents[0]); else openForm(null, iso);
}
function openForm(ev, iso, dayEvents){
  editing = ev || null; fromReq = null;
  $('ferr').textContent = '';
  $('fTitle').textContent = ev ? 'Modifică evenimentul' : 'Eveniment nou';
  $('fDel').classList.toggle('hidden', !ev);
  $('fDate').value = ev ? ev.date : (iso || TE.iso(new Date()));
  $('fType').value = ev ? ev.type : 'Nuntă';
  document.querySelector(`input[name=st][value=${ev ? ev.status : 'confirmat'}]`).checked = true;
  $('fName').value = ev?.client_name || ''; $('fPhone').value = ev?.client_phone || '';
  $('fCity').value = ev?.city || ''; $('fVenue').value = ev?.venue || '';
  $('fPrice').value = ev?.price ?? ''; $('fDep').value = ev?.deposit ?? '';
  $('fNotes').value = ev?.notes || '';
  // evenimentele deja existente în acea zi
  const de = $('dayEv');
  if (!ev && dayEvents && dayEvents.length) {
    de.innerHTML = `<div style="font-size:.85rem;color:var(--muted)">Deja în ${TE.nice(iso)}:</div>` + dayEvents.map(e =>
      `<button type="button" data-e="${e.id}"><span><b>${TE.esc(e.type)}</b> ${TE.esc([e.client_name, e.city].filter(Boolean).join(' · '))}</span><span style="color:var(--gold2);font-size:.85rem">Modifică ›</span></button>`).join('');
    de.querySelectorAll('[data-e]').forEach(b => b.onclick = () => openForm(dayEvents.find(e => e.id === b.dataset.e)));
    de.classList.remove('hidden');
  } else de.classList.add('hidden');
  checkCap();
  $('modal').classList.remove('hidden');
  setTimeout(() => (ev ? $('fName') : $('fType')).focus(), 50);
}
function checkCap(){
  const d = $('fDate').value;
  // data scrisă în cuvinte, ca să nu încurcăm ziua cu luna (Chrome poate afișa lună/zi/an)
  $('fDateTxt').textContent = d ? new Date(d + 'T12:00').toLocaleDateString('ro-RO', { weekday:'long', day:'numeric', month:'long', year:'numeric' }) : '';
  if (!d) return;
  const n = events.filter(e => e.date === d && e.id !== editing?.id).length;
  const w = $('capWarn');
  const busy = n >= TE.CAPACITY;
  if (busy) { w.textContent = `În ${TE.nice(d)} există deja un eveniment. Alege altă dată sau modifică evenimentul existent.`; w.classList.remove('hidden'); }
  else w.classList.add('hidden');
  $('fSave').disabled = busy;
  return busy;
}
$('fDate').addEventListener('change', checkCap);
const close = () => { $('modal').classList.add('hidden'); editing = null; fromReq = null; };
$('fCancel').onclick = close;
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') close(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('modal').classList.contains('hidden')) close(); });

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const num = v => v === '' ? null : Number(v);
  const row = {
    date: $('fDate').value, type: $('fType').value,
    status: document.querySelector('input[name=st]:checked').value,
    client_name: $('fName').value.trim() || null, client_phone: $('fPhone').value.trim() || null,
    city: $('fCity').value.trim() || null, venue: $('fVenue').value.trim() || null,
    price: num($('fPrice').value), deposit: num($('fDep').value),
    notes: $('fNotes').value.trim() || null
  };
  if (row.price != null && row.deposit != null && row.deposit > row.price) { $('ferr').textContent = 'Avansul e mai mare decât prețul.'; return; }
  // verificare în baza de date (data poate fi în altă lună decât cea afișată)
  let dq = sb.from('events').select('id', { count: 'exact', head: true }).eq('date', row.date);
  if (editing) dq = dq.neq('id', editing.id);
  const { count } = await dq;
  if (count >= TE.CAPACITY) { $('ferr').textContent = `În ${TE.nice(row.date)} există deja un eveniment.`; return; }
  $('fSave').disabled = true;
  const q = editing ? sb.from('events').update(row).eq('id', editing.id) : sb.from('events').insert(row).select('id').single();
  const { data: saved, error } = await q;
  $('fSave').disabled = false;
  if (error) { $('ferr').textContent = 'Nu s-a salvat: ' + error.message; return; }
  // evenimentul a venit dintr-o cerere: legăm cererea de el
  if (!editing && fromReq && saved) {
    await sb.from('requests').update({ event_id: saved.id, status: row.status === 'confirmat' ? 'confirmat' : 'contactat' }).eq('id', fromReq);
    loadReq();
  }
  const wasEdit = !!editing;
  close(); toast(wasEdit ? 'Modificat ✓' : 'Eveniment adăugat ✓');
  const d = new Date(row.date + 'T12:00'); y = d.getFullYear(); m = d.getMonth();
  draw();
});

async function del(ev){
  if (!ev || !confirm(`Ștergi ${ev.type.toLowerCase()} din ${TE.nice(ev.date)}${ev.client_name ? ' (' + ev.client_name + ')' : ''}?`)) return;
  const { error } = await sb.from('events').delete().eq('id', ev.id);
  if (error) { alert('Nu s-a șters: ' + error.message); return; }
  close(); toast('Șters ✓'); draw();
}
$('fDel').onclick = () => del(editing);
$('addBtn').onclick = () => openForm(null, TE.iso(new Date(y, m, Math.min(now.getDate(), 28))));

sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') show(false); });
boot();
</script>
</body>
